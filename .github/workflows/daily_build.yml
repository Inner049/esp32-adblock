name: Build and Deploy Blocklist and Dashboard

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build Blocklist
        run: |
          mkdir public
          python tools/build_blocklist.py public/blocklist.bin

      - name: Prepare Dashboard and OTA
        run: |
          cp -r dashboard/* public/ || true
          if [ -d "ota" ]; then cp -r ota public/ ; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
